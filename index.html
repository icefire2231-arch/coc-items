<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Objets Clash of Clans</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  <style>
    :root { --gold:#ffd23f; --gold-d:#b57f00; --elixir:#c43cf0; --ok:#58d12b; --ko:#e03a3a; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; color: #fff; overflow-x: hidden;
      font-family: "Lilita One", "Trebuchet MS", system-ui, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, #3b5fae55 0, transparent 40%),
        radial-gradient(circle at 80% 90%, #7a2fb355 0, transparent 40%),
        linear-gradient(160deg, #14264d, #0b1430 70%);
      background-attachment: fixed;
    }
    .stroke { text-shadow: -2px -2px 0 #0a1530, 2px -2px 0 #0a1530, -2px 2px 0 #0a1530, 2px 2px 0 #0a1530, 0 4px 0 #0a1530; }

    /* Particules de fond */
    #bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    #bg i { position: absolute; bottom: -20px; border-radius: 50%; opacity: 0; animation: floatUp linear infinite; }
    @keyframes floatUp { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: .8; } 100% { transform: translateY(-110vh) scale(1.2); opacity: 0; } }

    main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 1rem 1rem 3rem; }

    /* Titre */
    header { text-align: center; padding: 1.5rem 0 1rem; }
    h1 {
      margin: 0; font-weight: 400; font-size: clamp(2rem, 7vw, 3.6rem); letter-spacing: 1px;
      background: linear-gradient(#fff6b0, var(--gold) 55%, #ff9d00); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 4px 0 #0a1530) drop-shadow(0 0 14px #ffd23f66);
      animation: titleBob 3s ease-in-out infinite;
    }
    @keyframes titleBob { 50% { transform: translateY(-6px) scale(1.02); } }
    .sub { margin: .4rem 0 0; opacity: .85; font-size: 1.05rem; }
    .swords { display: inline-block; animation: swing 1.6s ease-in-out infinite; }
    @keyframes swing { 50% { transform: rotate(18deg) scale(1.15); } }

    /* Boutons façon CoC */
    .row { display: flex; gap: .55rem; flex-wrap: wrap; justify-content: center; margin: .6rem 0; }
    .btn {
      font: inherit; font-size: 1.05rem; color: #fff; cursor: pointer; padding: .5rem 1.1rem;
      background: linear-gradient(#7db4ff, #2f6fdb); border: 3px solid #153a7a; border-bottom-width: 7px; border-radius: 12px;
      text-shadow: 0 2px 0 #153a7a; transition: transform .08s, filter .15s; touch-action: manipulation;
    }
    .btn:hover { filter: brightness(1.15); transform: translateY(-2px); }
    .btn:active { transform: translateY(4px); border-bottom-width: 3px; }
    .btn.active { background: linear-gradient(#fff08a, #f5a300); border-color: #8a5a00; color: #5a3300; text-shadow: 0 1px 0 #fff8; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 18px #ffd23faa; } }
    #subfilters .btn { background: linear-gradient(#e08bff, #9a2fd0); border-color: #4d1470; text-shadow: 0 2px 0 #4d1470; font-size: .95rem; animation: slideIn .35s ease-out backwards; }
    #subfilters .btn.active { background: linear-gradient(#fff08a, #f5a300); border-color: #8a5a00; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-14px) scale(.8); } }
    #stockfilters .btn { font-size: .9rem; padding: .35rem .9rem; }
    #stockfilters .ok { background: linear-gradient(#9cf06a, #3da516); border-color: #1d5c08; text-shadow: 0 2px 0 #1d5c08; }
    #stockfilters .ko { background: linear-gradient(#ff8a8a, #c42626); border-color: #6a1010; text-shadow: 0 2px 0 #6a1010; }
    #stockfilters .btn.active { outline: 3px solid var(--gold); }

    #count { text-align: center; margin: .5rem 0 1rem; opacity: .9; }

    /* Grille et cartes */
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 1.2rem; perspective: 900px; }
    .cell { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) backwards; }
    @keyframes pop { from { opacity: 0; transform: scale(.4) translateY(40px) rotate(-6deg); } }
    .cell.bump { animation: bump .45s ease; }
    @keyframes bump { 30% { transform: scale(.92); } 60% { transform: scale(1.08); } }
    .cell.shake { animation: shake .45s ease; }
    @keyframes shake { 20%, 60% { transform: translateX(-9px) rotate(-2deg); } 40%, 80% { transform: translateX(9px) rotate(2deg); } }

    .card {
      position: relative; overflow: hidden; text-align: center; padding: .8rem .7rem 1rem; cursor: pointer; user-select: none;
      background: linear-gradient(#557fbf, #2b4678); border: 4px solid #0f1f3d; border-radius: 18px;
      box-shadow: inset 0 0 0 3px #8db3ea, 0 8px 0 #0a1530, 0 14px 24px #0008;
      transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--ty, 0px));
      transition: transform .15s ease-out, box-shadow .2s;
    }
    .card:hover { --ty: -8px; box-shadow: inset 0 0 0 3px #ffe27a, 0 12px 0 #0a1530, 0 20px 30px #000a, 0 0 24px #ffd23f55; }
    .card::after { /* reflet qui suit la souris */
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .2s;
      background: radial-gradient(circle at var(--mx, 50%) var(--my, 30%), #fff9, transparent 55%);
    }
    .card:hover::after { opacity: .55; }
    .card .pic { height: 120px; display: grid; place-items: center; }
    .card img { max-width: 100%; max-height: 120px; object-fit: contain; filter: drop-shadow(0 6px 4px #0007); animation: bob 3s ease-in-out infinite; }
    .cell:nth-child(2n) .card img { animation-delay: -1s; }
    .cell:nth-child(3n) .card img { animation-delay: -2s; }
    @keyframes bob { 50% { transform: translateY(-7px) rotate(1.5deg); } }
    .card .ph { font-size: 3.4rem; animation: bob 3s ease-in-out infinite; }
    .card h3 { margin: .5rem 0 0; font-weight: 400; font-size: 1.1rem; line-height: 1.15; }

    .badge { position: absolute; top: 8px; left: 8px; z-index: 2; font-size: .8rem; padding: .15rem .55rem; border-radius: 999px; border: 2px solid #0a1530; }
    .badge.ok { background: var(--ok); color: #123a00; box-shadow: 0 0 10px #58d12b99; }
    .badge.ko { background: var(--ko); color: #fff; }
    .card.off { background: linear-gradient(#6b7280, #3b4252); box-shadow: inset 0 0 0 3px #9aa3b5, 0 8px 0 #0a1530, 0 14px 24px #0008; }
    .card.off img, .card.off .ph { filter: grayscale(1) brightness(.55); animation: none; }
    .card.off h3 { opacity: .7; }
    .ribbon {
      position: absolute; z-index: 2; top: 50%; left: -20%; width: 140%; text-align: center; padding: .15rem 0;
      background: #c42626cc; border-block: 2px solid #fff6; font-size: .95rem; letter-spacing: 1px; transform: translateY(-50%) rotate(-12deg);
    }

    /* Effets souris / doigt */
    .spark { position: fixed; pointer-events: none; z-index: 999; font-size: 20px; transform: translate(-50%, -50%); animation: fly .75s ease-out forwards; }
    @keyframes fly { to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2) rotate(260deg); opacity: 0; } }
    .trail { position: fixed; pointer-events: none; z-index: 998; font-size: 14px; transform: translate(-50%, -50%); animation: trail .6s ease-out forwards; }
    @keyframes trail { to { transform: translate(-50%, calc(-50% - 22px)) scale(.2); opacity: 0; } }

    .msg { grid-column: 1 / -1; text-align: center; font-size: 1.3rem; padding: 2rem 0; }
    .spin { display: inline-block; animation: swing .8s ease-in-out infinite; font-size: 2rem; }
    footer { position: relative; z-index: 1; text-align: center; padding: 1.5rem 1rem 2rem; font-size: .85rem; opacity: .65; }

    @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } #bg { display: none; } }
  </style>
</head>
<body>
  <div id="bg"></div>

  <main>
    <header>
      <h1><span class="swords">⚔️</span> Objets Clash of Clans <span class="swords">⚔️</span></h1>
      <p class="sub stroke">Catalogue des objets et stock en direct</p>
    </header>

    <div id="filters" class="row"></div>
    <div id="subfilters" class="row"></div>
    <div id="stockfilters" class="row"></div>
    <div id="count" class="stroke"></div>
    <div id="grid"></div>
  </main>

  <footer>Site de fans, non affilié à Supercell.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
  <script>
    // >>> A REMPLACER par vos valeurs (Supabase > Project Settings > API) <<<
    const SUPABASE_URL = "https://nomfsmolgmzknzokjnqr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_t4i6v43yTj7VTkUEXyW_UA_JBf7oe8P";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let cats = [], parent = null, sub = null, stockF = "all";

    /* ---------- Particules de fond ---------- */
    (function () {
      const bg = document.getElementById("bg");
      for (let i = 0; i < 22; i++) {
        const p = document.createElement("i");
        const size = 6 + Math.random() * 12;
        const gold = Math.random() > .5;
        p.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size}px;` +
          `background:radial-gradient(circle at 35% 35%, #fff, ${gold ? "#ffd23f" : "#c43cf0"} 60%);` +
          `box-shadow:0 0 12px ${gold ? "#ffd23f" : "#c43cf0"};` +
          `animation-duration:${8 + Math.random() * 12}s;animation-delay:${-Math.random() * 15}s;`;
        bg.appendChild(p);
      }
    })();

    /* ---------- Effets souris / doigt ---------- */
    function burst(x, y, symbols, n = 12) {
      for (let i = 0; i < n; i++) {
        const s = document.createElement("span");
        s.className = "spark";
        s.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        const a = Math.random() * Math.PI * 2, d = 45 + Math.random() * 70;
        s.style.left = x + "px"; s.style.top = y + "px";
        s.style.setProperty("--dx", Math.cos(a) * d + "px");
        s.style.setProperty("--dy", Math.sin(a) * d + "px");
        document.body.appendChild(s);
        s.addEventListener("animationend", () => s.remove());
      }
    }

    let lastTrail = 0;
    document.addEventListener("pointermove", e => {
      const now = performance.now();
      if (now - lastTrail < 45) return;
      lastTrail = now;
      const t = document.createElement("span");
      t.className = "trail";
      t.textContent = Math.random() > .5 ? "✦" : "✧";
      t.style.color = Math.random() > .5 ? "#ffd23f" : "#e08bff";
      t.style.left = e.clientX + "px"; t.style.top = e.clientY + "px";
      document.body.appendChild(t);
      t.addEventListener("animationend", () => t.remove());
    });

    // Petite explosion à chaque appui (souris ou doigt)
    document.addEventListener("pointerdown", e => burst(e.clientX, e.clientY, ["⭐", "✨", "💛"], 6));

    /* ---------- Filtres ---------- */
    function addBtn(box, label, active, onclick, extra = "") {
      const b = document.createElement("button");
      b.textContent = label;
      b.className = "btn " + extra + (active ? " active" : "");
      b.onclick = onclick;
      box.appendChild(b);
    }

    function renderFilters() {
      const top = document.getElementById("filters");
      const subBox = document.getElementById("subfilters");
      const stockBox = document.getElementById("stockfilters");
      top.innerHTML = subBox.innerHTML = stockBox.innerHTML = "";

      addBtn(top, "Tout", parent === null, () => { parent = null; sub = null; refresh(); });
      cats.filter(c => !c.parent_id).forEach(c =>
        addBtn(top, c.name, parent === c.id, () => { parent = c.id; sub = null; refresh(); }));

      if (parent) {
        const children = cats.filter(c => c.parent_id === parent);
        if (children.length) {
          addBtn(subBox, "Tous", sub === null, () => { sub = null; refresh(); });
          children.forEach(c => addBtn(subBox, c.name, sub === c.id, () => { sub = c.id; refresh(); }));
        }
      }

      addBtn(stockBox, "Tout le stock", stockF === "all", () => { stockF = "all"; refresh(); });
      addBtn(stockBox, "✔ Disponibles", stockF === "1", () => { stockF = "1"; refresh(); }, "ok");
      addBtn(stockBox, "✖ Indisponibles", stockF === "0", () => { stockF = "0"; refresh(); }, "ko");
    }

    /* ---------- Cartes ---------- */
    function makeCard(item, index) {
      const qty = Number(item.stock) || 0;
      const available = qty > 0;

      const cell = document.createElement("div");
      cell.className = "cell";
      cell.style.animationDelay = Math.min(index * 45, 900) + "ms";

      const card = document.createElement("div");
      card.className = "card" + (available ? "" : " off");

      const badge = document.createElement("div");
      badge.className = "badge " + (available ? "ok" : "ko");
      badge.textContent = available ? "✔ Dispo ×" + qty : "✖ Indispo";
      card.appendChild(badge);

      const pic = document.createElement("div");
      pic.className = "pic";
      const ph = () => { const d = document.createElement("div"); d.className = "ph"; d.textContent = "🛡️"; return d; };
      if (item.image_url) {
        const img = document.createElement("img");
        img.src = item.image_url; img.alt = item.name; img.loading = "lazy"; img.draggable = false;
        img.onerror = () => img.replaceWith(ph());
        pic.appendChild(img);
      } else pic.appendChild(ph());
      card.appendChild(pic);

      const h = document.createElement("h3");
      h.className = "stroke";
      h.textContent = item.name;
      card.appendChild(h);

      if (!available) {
        const r = document.createElement("div");
        r.className = "ribbon stroke";
        r.textContent = "INDISPONIBLE";
        card.appendChild(r);
      }

      // Inclinaison 3D + reflet (souris uniquement)
      card.addEventListener("pointermove", e => {
        if (e.pointerType !== "mouse") return;
        const r = card.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
        card.style.setProperty("--ry", px * 16 + "deg");
        card.style.setProperty("--rx", -py * 16 + "deg");
        card.style.setProperty("--mx", (px + .5) * 100 + "%");
        card.style.setProperty("--my", (py + .5) * 100 + "%");
      });
      card.addEventListener("pointerleave", () => {
        card.style.setProperty("--rx", "0deg"); card.style.setProperty("--ry", "0deg");
      });

      // Clic : rebond + étincelles (ou secousse si indisponible)
      card.addEventListener("click", e => {
        const cls = available ? "bump" : "shake";
        cell.classList.remove("bump", "shake");
        void cell.offsetWidth;
        cell.classList.add(cls);
        if (available) burst(e.clientX, e.clientY, ["⭐", "🪙", "✨", "💎"], 14);
        else burst(e.clientX, e.clientY, ["✖", "💨"], 8);
      });

      cell.appendChild(card);
      return cell;
    }

    async function loadItems() {
      const grid = document.getElementById("grid");
      const count = document.getElementById("count");
      grid.innerHTML = '<div class="msg stroke"><span class="spin">⚔️</span><br>Chargement...</div>';

      let q = db.from("items").select("*").order("stock", { ascending: false }).order("name");
      if (sub) q = q.eq("category_id", sub);
      else if (parent) q = q.in("category_id", [parent, ...cats.filter(c => c.parent_id === parent).map(c => c.id)]);
      if (stockF === "1") q = q.gt("stock", 0);
      else if (stockF === "0") q = q.eq("stock", 0);

      const { data, error } = await q;
      grid.innerHTML = "";
      if (error) { grid.innerHTML = '<div class="msg stroke">😢 Erreur de chargement</div>'; count.textContent = ""; return; }
      if (!data.length) { grid.innerHTML = '<div class="msg stroke">Aucun objet trouvé 🕵️</div>'; count.textContent = ""; return; }

      const dispo = data.filter(i => Number(i.stock) > 0).length;
      count.textContent = `${data.length} objet${data.length > 1 ? "s" : ""} • ${dispo} disponible${dispo > 1 ? "s" : ""}`;
      data.forEach((item, i) => grid.appendChild(makeCard(item, i)));
    }

    function refresh() { renderFilters(); loadItems(); }

    async function init() {
      const { data } = await db.from("categories").select("*").order("id");
      cats = data || [];
      refresh();
    }
    init();
  </script>
</body>
</html>
